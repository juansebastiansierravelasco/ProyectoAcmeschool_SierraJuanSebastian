<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios</title>
    <link rel="stylesheet" href="../css/usuario.css">
    <script type="module" src="../js/usuarios.js"></script>
</head>
<body>
    <header class="header">
        <h1>Acme School</h1>
        <p>Plataforma de gestión de exámenes</p>
    </header>

    <main class="main">

    <section class="usuarios-section">

        <div class="usuarios-header">
            <h2 class="titulo">Gestión de usuarios</h2>

            <button class="btn-registrar" id="registrar-usuario">
                Registrar usuario
            </button>
        </div>

        <div class="tabla-container" id="tabla-usuarios">

            <table class="tabla-usuarios">

    <thead>
        <tr>
            <th>Identificación</th>
            <th>Nombre completo</th>
            <th>Correo electrónico</th>
            <th>Teléfono</th>
            <th>Cargo</th>
            <th>Acciones</th>
        </tr>
    </thead>

    <tbody id="lista-usuarios">
        
    </tbody>

</table>

        </div>

    </section>

    <section id="formulario-registro" class="formulario-section">

    <h2>Registrar usuario</h2>

    <form id="formulario-usuario">

        <label for="identificacion">Identificación</label>
        <input type="text" id="identificacion" name="identificacion" required>
        <label for="nombreCompleto">Nombre completo</label>
        <input type="text" id="nombreCompleto" name="nombreCompleto" required>
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" required>
        <label for="telefono">Teléfono</label>
        <input type="tel" id="telefono" name="telefono" required>
        <label for="cargo">Cargo</label>

        <select id="cargo" name="cargo" required>
        <option value="">Selecciona un cargo</option>
        <option value="Administrativo">Administrativo</option>
        <option value="Docente">Docente</option>
        <option value="Estudiante">Estudiante</option>
        </select>

        <label for="contrasena">Contraseña</label>
        <input type="password" id="contrasena" name="contrasena" required>
       
        <button type="submit" id="guardar-usuario">
        Guardar usuario
        </button>
        
        <button type="button" id="cancelar-registro">
         Cancelar
        </button>

    </form>

     </section>
</main>


</body>
</html>
