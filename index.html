<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acme School</title>
    <link rel="stylesheet" href="css/styles.css">
    <script type="module" src="js/main.js"></script>
</head>

<body>

    <header class="header">
        <h1>Acme School</h1>
        <p>Plataforma de gestión de exámenes</p>
    </header>

    <main class="main">

        <section class="login-section">

            <h2>Iniciar sesión</h2>

            <form id="login-form">

                <label for="correo">Correo electrónico:</label>
                <input
                    type="email"
                    id="correo"
                    placeholder="Ingresa tu correo"
                    required
                >

                <br><br>

                <label for="contrasena">Contraseña:</label>
                <input
                    type="password"
                    id="contrasena"
                    placeholder="Ingresa tu contraseña"
                    required
                >

                <br><br>

                <button type="submit">Iniciar sesión</button>

            </form>

        </section>

        <section class="login-section acceso-estudiante">

            <h2>Acceso para estudiantes</h2>

            <p>Ingresa aquí para presentar tus exámenes.</p>

            <a href="./pages/resolver.html" class="boton-principal">
                Presentar examen
            </a>

        </section>

    </main>

    <footer class="footer">
        <p>&copy; 2026 Acme School. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
